# Strict static analysis for Ruach. Zero errors and zero warnings are required
# by check.yml (blueprint section 9).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by gen-l10n; its delegate list names the deprecated Material
    # localizations, which Ruach does not use (it passes its own list).
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
