name: ruach
description: "Ruach: Bible Car Racing Game. A 2D top-down racing game with scripture verse cards in 11 languages."
# Never published to pub.dev.
publish_to: 'none'

# Version and build number. The release workflow may override both with
# --build-name and --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Dependencies are added by the batch that first needs them (blueprint
# section 10). Flutter 3.50 moved the Material widgets into a separate
# package; Ruach draws its own components on the widgets layer and does not
# depend on it (decision D-007).
dependencies:
  flutter:
    sdk: flutter
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No Material icon font. The icon set is chosen in batch p1d.
  uses-material-design: false
