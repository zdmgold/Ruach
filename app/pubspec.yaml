name: ruach
description: "Ruach: Bible Car Racing Game. A 2D top-down racing game with scripture verse cards in 11 languages."
# Never published to pub.dev.
publish_to: 'none'

# Version and build number. The release workflow may override both with
# --build-name and --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# Dependencies are added by the batch that first needs them (blueprint
# section 10). Flutter 3.50 moved the Material widgets into a separate
# package; Ruach draws its own components on the widgets layer and does not
# depend on it (decision D-007).
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No Material icon font. Icons are the Phosphor Bold font (decision D-021).
  uses-material-design: false

  # Barlow, the one bundled Latin face (SIL Open Font License, notice in
  # assets/notices/barlow-OFL.txt). Other scripts use the system fonts.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

    # Phosphor Icons, Bold weight (MIT, notice in assets/notices/phosphor-MIT.txt).
    # Referenced only through AppIcons in lib/theme/icons.dart.
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf

  # Licence notices shown on the Licenses screen.
  assets:
    - assets/notices/
